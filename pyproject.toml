[project]
name = "final-report-simulation"
version = "1.0.0"
description = "Econometric Simulation & Validation: Autonomous AI Sales Agent vs BDA (Topics in Econometrics B Final Report)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
